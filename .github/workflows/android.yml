
name: Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uchet-pro.jks"
          chmod 600 "$RUNNER_TEMP/uchet-pro.jks"

          test -s "$RUNNER_TEMP/uchet-pro.jks"
          
      - name: Check ShiftScreen source
        run: |
          echo "Checking source files..."
          ls -la app/src/main/java/com/example/uchetdohodapro/
          echo "Checking ShiftScreen.kt..."
          test -f app/src/main/java/com/example/uchetdohodapro/ShiftScreen.kt
          grep -n "package\|fun ShiftScreen" app/src/main/java/com/example/uchetdohodapro/ShiftScreen.kt
          
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/uchet-pro.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PATH" ] || [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file not found"
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: Signing secrets are missing"
            exit 1
          fi

          gradle testDebugUnitTest lintDebug lintRelease assembleDebug assembleDebugAndroidTest
      - name: Verify restored keystore certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/uchet-pro.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep SHA256
            
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Download original signed 1.0.9 for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          gh api repos/${{ github.repository }}/actions/artifacts/12460847768/zip > "$RUNNER_TEMP/baseline.zip"
          unzip -q "$RUNNER_TEMP/baseline.zip" -d baseline
          test -s baseline/app-debug.apk
          old_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs baseline/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          new_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$old_cert"
          test "$old_cert" = "$new_cert"

      - name: Enable KVM for this runner
        run: |
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 600 /dev/kvm

      - name: Test update, offline small screen and SAF recovery
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/uchet-pro.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash scripts/emulator-regression.sh

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            regression-evidence/
          if-no-files-found: warn

      - name: Package versioned APK and verification metadata
        id: apk
        run: python3 scripts/package_apk.py

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          
